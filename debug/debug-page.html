<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRC 调试工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: 13px;
            background: #F5F5F5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #007AFF;
        }
        .status {
            padding: 10px 15px;
            margin: 10px 0;
            border-radius: 4px;
            font-weight: 500;
        }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        .log-panel {
            margin-top: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            background: #fafafa;
        }
        .log-header {
            padding: 10px 15px;
            background: #f0f0f0;
            border-bottom: 1px solid #e0e0e0;
            font-weight: 600;
        }
        .log-content {
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.6;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-line { margin: 5px 0; }
        .log-line.info { color: #007AFF; }
        .log-line.success { color: #28a745; font-weight: 600; }
        .log-line.error { color: #dc3545; font-weight: 600; }
        .log-line.warn { color: #ffc107; }
        .btn {
            background: #007AFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 10px 5px 10px 0;
        }
        .btn:hover { background: #0056b3; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 DRC 调试工具</h1>
        
        <div id="status"></div>
        
        <div style="margin: 20px 0;">
            <button class="btn" onclick="runDebug()">运行 DRC 调试</button>
            <button class="btn" onclick="checkCrossings()">检查走线交叉</button>
            <button class="btn" onclick="clearLog()">清空日志</button>
        </div>
        
        <div class="log-panel">
            <div class="log-header">调试日志</div>
            <div class="log-content" id="logContainer"></div>
        </div>
    </div>

    <script>
        let eda = null;
        
        // 尝试获取 EDA 对象
        function getEda() {
            if (window.eda) {
                eda = window.eda;
                return true;
            }
            if (window.parent && window.parent.eda) {
                eda = window.parent.eda;
                return true;
            }
            return false;
        }
        
        function log(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const div = document.createElement('div');
            div.className = `log-line ${type}`;
            div.textContent = message;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.textContent = message;
        }
        
        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
            showStatus('日志已清空', 'info');
        }
        
        async function runDebug() {
            log('=== DRC 调试开始 ===', 'info');
            
            if (!getEda()) {
                log('❌ 无法访问 EDA API', 'error');
                log('提示：请在嘉立创 EDA 环境中打开此页面', 'warn');
                showStatus('无法访问 EDA API', 'error');
                return;
            }
            
            log('✅ EDA API 可用', 'success');
            
            try {
                // 检查文档
                log('检查当前文档...', 'info');
                const doc = eda.dmt_SelectControl.getCurrentDocumentInfo();
                log('文档信息：' + JSON.stringify(doc), 'info');
                
                if (!doc) {
                    log('❌ 未找到当前文档', 'error');
                    return;
                }
                
                const docType = doc.documentType;
                log('文档类型：' + docType, docType === 3 ? 'success' : 'warn');
                
                if (docType !== 3) {
                    log('⚠️ 当前不是 PCB 文档 (documentType=' + docType + ')', 'warn');
                } else {
                    log('✅ 当前是 PCB 文档', 'success');
                }
                
                // 获取网络
                log('获取网络列表...', 'info');
                const nets = await eda.pcb_Net.getAllNetsName();
                log('网络数量：' + (nets ? nets.length : 0), 'info');
                
                // 获取走线
                log('获取走线...', 'info');
                const lines = await eda.pcb_PrimitiveLine.getAll();
                log('走线数量：' + (lines ? lines.length : 0), 'info');
                
                // DRC 检查
                log('运行 DRC 检查 (eda.pcb_Drc.check)...', 'info');
                const drc = await eda.pcb_Drc.check(true, true, false);
                log('DRC 结果：' + (drc ? '✅ 通过' : '❌ 失败'), drc ? 'success' : 'error');
                
                // 检查交叉
                log('检查走线交叉...', 'info');
                let crossCount = 0;
                if (lines && lines.length > 1) {
                    for (let i = 0; i < lines.length; i++) {
                        for (let j = i + 1; j < lines.length; j++) {
                            const l1 = lines[i], l2 = lines[j];
                            if (l1.layer === l2.layer && l1.net !== l2.net) {
                                const x1=l1.startX, y1=l1.startY, x2=l1.endX, y2=l1.endY;
                                const x3=l2.startX, y3=l2.startY, x4=l2.endX, y4=l2.endY;
                                const d = (x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
                                if (d !== 0) {
                                    const t = ((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d;
                                    const u = -((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/d;
                                    if (t>0 && t<1 && u>0 && u<1) {
                                        crossCount++;
                                        log('  交叉 ' + crossCount + ': ' + l1.net + ' 与 ' + l2.net, 'error');
                                    }
                                }
                            }
                        }
                    }
                }
                log('交叉总数：' + crossCount, crossCount > 0 ? 'error' : 'success');
                
            } catch (err) {
                log('调试出错：' + err.message, 'error');
                log('堆栈：' + err.stack, 'error');
            }
            
            log('=== DRC 调试结束 ===', 'info');
            showStatus('调试完成', 'success');
        }
        
        async function checkCrossings() {
            log('=== 检查走线交叉 ===', 'info');
            
            if (!getEda()) {
                log('❌ 无法访问 EDA API', 'error');
                return;
            }
            
            try {
                const lines = await eda.pcb_PrimitiveLine.getAll();
                log('走线数量：' + (lines ? lines.length : 0), 'info');
                
                let crossCount = 0;
                if (lines && lines.length > 1) {
                    for (let i = 0; i < lines.length; i++) {
                        for (let j = i + 1; j < lines.length; j++) {
                            const l1 = lines[i], l2 = lines[j];
                            if (l1.layer === l2.layer && l1.net !== l2.net) {
                                const x1=l1.startX, y1=l1.startY, x2=l1.endX, y2=l1.endY;
                                const x3=l2.startX, y3=l2.startY, x4=l2.endX, y4=l2.endY;
                                const d = (x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
                                if (d !== 0) {
                                    const t = ((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d;
                                    const u = -((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/d;
                                    if (t>0 && t<1 && u>0 && u<1) {
                                        crossCount++;
                                        log('  交叉 ' + crossCount + ': ' + l1.net + ' 与 ' + l2.net, 'error');
                                    }
                                }
                            }
                        }
                    }
                }
                log('交叉总数：' + crossCount, crossCount > 0 ? 'error' : 'success');
            } catch (err) {
                log('检查出错：' + err.message, 'error');
            }
        }
        
        // 页面加载时检查 EDA 环境
        window.onload = function() {
            if (getEda()) {
                showStatus('✅ EDA 环境可用', 'success');
                log('EDA 调试工具已就绪', 'success');
                log('请点击"运行 DRC 调试"按钮开始调试', 'info');
            } else {
                showStatus('❌ 无法访问 EDA API，请在嘉立创 EDA 环境中打开此页面', 'error');
                log('无法访问 EDA API', 'error');
            }
        };
    </script>
</body>
</html>
